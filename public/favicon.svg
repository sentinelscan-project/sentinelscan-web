<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#2563eb" />
      <stop offset="80%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Bevel / Inner Depth Gradient -->
    <linearGradient id="bevelGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- Outer Rim Stroke Gradient -->
    <linearGradient id="rimGrad" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.3" />
    </linearGradient>

    <!-- Scan Wave Gradient -->
    <linearGradient id="waveGrad" x1="14" y1="32" x2="50" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Scan Glow Filter -->
    <filter id="scanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for Shield -->
    <filter id="shieldShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Sentinel Outer Shield -->
  <g filter="url(#shieldShadow)">
    <path
      d="M32 5.5 L13 13.5 V28.5 C13 41.5 21.8 53.2 32 57 C42.2 53.2 51 41.5 51 28.5 V13.5 Z"
      fill="url(#shieldGrad)"
      stroke="url(#rimGrad)"
      stroke-width="1.8"
      stroke-linejoin="round"
    />
  </g>

  <!-- Inner Bevel Highlight -->
  <path
    d="M32 8.5 L15.5 15.5 V28.5 C15.5 39.8 23.2 50 32 53.5 C40.8 50 48.5 39.8 48.5 28.5 V15.5 Z"
    fill="url(#bevelGrad)"
  />

  <!-- Subtle Radar Rings / Sonar Arcs -->
  <path
    d="M32 20 A12 12 0 0 1 44 32"
    stroke="#93c5fd"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-opacity="0.4"
  />
  <path
    d="M32 24 A8 8 0 0 1 40 32"
    stroke="#93c5fd"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-opacity="0.6"
  />
  
  <!-- Horizontal Horizon / Grid Crosshair Lines (faint) -->
  <line x1="16" y1="32" x2="48" y2="32" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="2 2" />
  <line x1="32" y1="16" x2="32" y2="48" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="2 2" />

  <!-- Radar Core Target Node -->
  <circle cx="32" cy="32" r="2.2" fill="#ffffff" fill-opacity="0.95" />

  <!-- Telemetry Scan Pulse Wave (The Signature 'Scan' Sweep) -->
  <path
    d="M17 32 H25 L29 21 L33 42 L37 28 L40 33 H47"
    stroke="url(#waveGrad)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#scanGlow)"
  />

  <!-- Active Scan Ping Points -->
  <circle cx="29" cy="21" r="1.6" fill="#ffffff" />
  <circle cx="33" cy="42" r="1.8" fill="#67e8f9" />
</svg>
